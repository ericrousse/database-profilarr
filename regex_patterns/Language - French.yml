name: Language - French
pattern: (?i)\b(?:french|fr|fra|fre|vf{1,2}|vostfr|vofr|franc(?:ais|aise)|franc[ea]s)\b
description: Detects French language indicators in release filenames or audio/subtitle tags.
tags: [language, french]
tests:
- expected: true
  id: 1
  input: "Movie.Title.2020.FRENCH.1080p.BluRay.mkv"
- expected: true
  id: 2
  input: "Serie.S01E01.VF.720p.WEBRip.mkv"
- expected: true
  id: 3
  input: "Film.Name.2019.VOSTFR.1080p.x264.mkv"
- expected: false
  id: 4
  input: "Movie.Title.2020.ENGLiSH.1080p.mkv"
- expected: false
  id: 5
  input: "Some.Title.2021.1080p.BluRay.DD5.1.ENG.mkv"
